AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  SAM application that deploys a Lambda from an ECR image URI stored in SSM Parameter Store.
  Includes SQS triggers and DLQs.

Parameters:
  S3BucketName:
    Type: String
    Description: The name of the S3 bucket the Lambda needs access to.

  # 1. New parameter to specify the NAME of the Secret Manager secret holding the Image URI
  LambdaImageUriSecretName:
    Type: String
    Description: The name of the AWS Secrets Manager secret that stores the ECR Image URI.

  EnvironmentName:
    Type: String
    Description: The environment name

Resources:
  # --- Dead Letter Queues (DLQs) and Main Queues remain the same ---
  SourceDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "transcode-queue-dlq-${EnvironmentName}"
      MessageRetentionPeriod: 1209600 # 14 days

  SourceQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "transcode-queue-${EnvironmentName}"
      VisibilityTimeout: 120
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt SourceDLQ.Arn
        maxReceiveCount: 5

  DestinationQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "transcode-done-queue-${EnvironmentName}"
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt SourceDLQ.Arn
        maxReceiveCount: 5

  # ---------------- Lambda Function (Modified) ----------------

  TranscodeProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "transcode-function-${EnvironmentName}"
      PackageType: Image
      ImageUri: !Sub "{{resolve:secretsmanager:${LambdaImageUriSecretName}}}"

      Architectures:
        - x86_64
      Timeout: 120
      Environment:
        Variables:
          SQS_INPUT_QUEUE_NAME: !GetAtt SourceQueue.QueueName
          SQS_OUTPUT_QUEUE_NAME: !GetAtt DestinationQueue.QueueName
          SQS_DLQ_QUEUE_NAME: !GetAtt SourceDLQ.QueueName
          SQS_INPUT_QUEUE_URL: !Ref SourceQueue
          SQS_OUTPUT_QUEUE_URL: !Ref DestinationQueue
          SQS_DLQ_QUEUE_URL: !Ref SourceDLQ
          S3_BUCKET_NAME: !Ref S3BucketName
          MAX_RETRIES: 3
          VISIBILITY_TIMEOUT: 120
          WAIT_TIME_SECONDS: 20
          MAX_WIDTH: 3840
          RESOURCES_REGION: !Sub '${AWS::Region}'


      Events:
        SqsEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt SourceQueue.Arn
            BatchSize: 1

      Policies:
        - SQSSendMessagePolicy:
            QueueName: !GetAtt DestinationQueue.QueueName
        - S3CrudPolicy:
            BucketName: !Ref S3BucketName
        - SQSSendMessagePolicy:
            QueueName: !GetAtt SourceDLQ.QueueName

# --- Outputs remain the same ---
Outputs:
  SourceQueueURL:
    Description: "URL of the source SQS queue"
    Value: !Ref SourceQueue
  SourceDLQURL:
    Description: "URL of the source Dead Letter Queue"
    Value: !Ref SourceDLQ
  DestinationQueueURL:
    Description: "URL of the destination SQS queue"
    Value: !Ref DestinationQueue
  LambdaFunctionArn:
    Description: "ARN of the SQS Processor Lambda function"
    Value: !GetAtt TranscodeProcessorFunction.Arn