AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  SAM application that deploys a Lambda from an ECR image URI stored in SSM Parameter Store.
  Includes SQS triggers and DLQs.

Parameters:
  S3BucketName:
    Type: String
    Description: The name of the S3 bucket the Lambda needs access to.

  # 1. New parameter to specify the NAME of the Secret Manager secret holding the Image URI
  LambdaImageUriSecretName:
    Type: String
    Description: The name of the AWS Secrets Manager secret that stores the ECR Image URI.

  EnvironmentName:
    Type: String
    Description: The environment name

  SqsQueueDlqName:
    Type: String
    Description: The sqs dlq name

  SqsQueueDlqUrl:
    Type: String
    Description: The sqs dlq url

  SqsQueueName:
    Type: String
    Description: The sqs name to receive message to transcode videos

  SqsQueueUrl:
    Type: String
    Description: The sqs url to receive message to transcode videos

  SqsQueueArn:
    Type: String
    Description: The sqs arn to receive message to transcode videos

  SqsQueueDoneName:
    Type: String
    Description: The sqs name  to send message to let know the video has been transcode

  SqsQueueDoneUrl:
    Type: String
    Description: The sqs url  to send message to let know the video has been transcode


Resources:
  # ---------------- Lambda Function (Modified) ----------------

  TranscodeProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "transcode-function-${EnvironmentName}"
      PackageType: Image
      ImageUri: !Sub "{{resolve:secretsmanager:${LambdaImageUriSecretName}}}"

      Architectures:
        - x86_64
      Timeout: 120
      Environment:
        Variables:
          SQS_INPUT_QUEUE_NAME: !Ref SqsQueueName
          SQS_OUTPUT_QUEUE_NAME: !Ref SqsQueueDoneName
          SQS_DLQ_QUEUE_NAME: !Ref SqsQueueDlqName
          SQS_INPUT_QUEUE_URL: !Ref SqsQueueUrl
          SQS_OUTPUT_QUEUE_URL: !Ref SqsQueueDoneUrl
          SQS_DLQ_QUEUE_URL: !Ref SqsQueueDlqUrl
          S3_BUCKET_NAME: !Ref S3BucketName
          MAX_RETRIES: 3
          VISIBILITY_TIMEOUT: 120
          WAIT_TIME_SECONDS: 20
          MAX_WIDTH: 3840
          RESOURCES_REGION: !Sub '${AWS::Region}'


      Policies:
        - SQSPollerPolicy:
            QueueName: !Ref SqsQueueName
        - SQSSendMessagePolicy:
            QueueName: !Ref SqsQueueDoneName
        - S3CrudPolicy:
            BucketName: !Ref S3BucketName
        - SQSSendMessagePolicy:
            QueueName: !Ref SqsQueueDlqName

  MyLambdaEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      DependsOn: TranscodeProcessorFunction
      FunctionName: !GetAtt TranscodeProcessorFunction.Arn
      EventSourceArn: !Ref SqsQueueArn # Use the parameter you already have
      BatchSize: 1

# --- Outputs remain the same ---
Outputs:
  LambdaFunctionArn:
    Description: "ARN of the SQS Processor Lambda function"
    Value: !GetAtt TranscodeProcessorFunction.Arn